<body>
  <header class="nav">

    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a class="active" href="resume.html">Resume</a>
    </nav>
  </header>

  <main class="page resume-page">
    <div class="resume-heading">
      <h1>Resume</h1>
      <a class="button" href="assets/resume.pdf" download="Liam-Korol-Resume.pdf">Download resume <span>↓</span></a>
    </div>

    <section class="resume-preview-wrap" aria-label="Resume PDF viewer">
      <div class="pdf-toolbar">
        <div class="pdf-toolbar-group">
          <button type="button" id="pdf-prev" aria-label="Previous page">←</button>
          <span><span id="pdf-page">1</span> / <span id="pdf-pages">1</span></span>
          <button type="button" id="pdf-next" aria-label="Next page">→</button>
        </div>
        <div class="pdf-toolbar-group">
          <button type="button" id="pdf-zoom-out" aria-label="Zoom out">−</button>
          <span id="pdf-zoom">100%</span>
          <button type="button" id="pdf-zoom-in" aria-label="Zoom in">+</button>
          <a href="assets/resume.pdf" target="_blank">Open PDF ↗</a>
        </div>
      </div>
      <div class="pdf-canvas-wrap" id="pdf-canvas-wrap">
        <canvas id="resume-canvas" aria-label="Rendered resume page"></canvas>
        <p class="pdf-error" id="pdf-error" hidden>Unable to load the résumé preview. Please use the download button above.</p>
      </div>
    </section>
  </main>

  <footer>
    
    <div>
      <a href="mailto:liam.korol@duke.edu">liam.korol@duke.edu</a>
